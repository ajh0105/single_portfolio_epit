<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // GitHub Pages SPA 라우팅 — 404.html이 인코딩한 경로를 복원
      ;(function(l) {
        if (l.search[1] === 'p' && l.search.indexOf('p=/') === 1) {
          var decoded = l.search.slice(1).split('&').reduce(function(acc, s) {
            var kv = s.split('='); if (kv[0] === 'p') acc.path = '/' + kv.slice(1).join('=').replace(/~and~/g, '&')
            if (kv[0] === 'q') acc.query = '?' + kv.slice(1).join('=').replace(/~and~/g, '&')
            return acc
          }, { path: '', query: '' })
          window.history.replaceState(null, null, l.pathname + decoded.path + decoded.query + l.hash)
        }
      }(window.location))
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-pit 스마트 충전소 관제 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Nanum Gothic', 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
