version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: epit-postgres
    environment:
      POSTGRES_DB: epit_db
      POSTGRES_USER: epit_user
      POSTGRES_PASSWORD: epit_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epit_user -d epit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: epit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epit-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epit_db
      SPRING_DATASOURCE_USERNAME: epit_user
      SPRING_DATASOURCE_PASSWORD: epit_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      AI_SERVER_URL: http://ai-server:8000
      JWT_SECRET: your-256-bit-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: epit-ai-server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://epit_user:epit_password@postgres:5432/epit_db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./ai-server/models/weights:/app/models/weights
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
