spring:
  application:
    name: epit-admin

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/epit}
    username: ${SPRING_DATASOURCE_USERNAME:epit}
    password: ${SPRING_DATASOURCE_PASSWORD:epit123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:change-this-to-a-random-256bit-secret-string-in-dev}
  access-exp-min: ${JWT_ACCESS_EXP_MIN:30}
  refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}

internal:
  api-token: ${INTERNAL_API_TOKEN:internal-dev-token}

ai:
  server-url: ${AI_SERVER_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.epit.admin: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
